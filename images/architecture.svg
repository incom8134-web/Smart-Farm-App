<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Smart Farm System Architecture</title>
  <desc id="desc">Android app communicates with Arduino Nano over Bluetooth and ESP32-CAM over Wi-Fi. Arduino controls sensors, LED, fan and pump in the grow dome. Camera frames are analyzed by a lettuce growth detection model and results return to the app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef8f2"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12335c"/>
      <stop offset="1" stop-color="#0d6a68"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fff3"/>
      <stop offset="1" stop-color="#d8f5e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f73d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#23a66f"/>
    </marker>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#16324f"/>
    </marker>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#102844}
      .subtitle{font:400 22px Arial,sans-serif;fill:#607087}
      .section{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#668099}
      .cardTitle{font:700 26px Arial,sans-serif;fill:#102844}
      .cardText{font:400 19px Arial,sans-serif;fill:#506176}
      .small{font:600 16px Arial,sans-serif;fill:#506176}
      .pill{font:700 16px Arial,sans-serif;fill:#fff}
      .link{font:700 17px Arial,sans-serif;fill:#245caa}
      .linkGreen{font:700 17px Arial,sans-serif;fill:#168254}
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1470" cy="100" r="210" fill="#dff2ff" opacity=".45"/>
  <circle cx="90" cy="840" r="230" fill="#dff6e9" opacity=".55"/>

  <text x="80" y="82" class="title">AI Smart Farm System Architecture</text>
  <text x="80" y="122" class="subtitle">Environmental control, live camera monitoring, and lettuce growth detection</text>

  <text x="100" y="190" class="section">USER INTERFACE</text>
  <text x="560" y="190" class="section">EDGE CONTROLLERS</text>
  <text x="1090" y="190" class="section">SMART FARM + AI</text>

  <!-- Android app -->
  <g filter="url(#shadow)">
    <rect x="80" y="225" width="350" height="520" rx="38" fill="url(#phone)"/>
    <rect x="112" y="270" width="286" height="425" rx="26" fill="#f8fbff"/>
  </g>
  <circle cx="255" cy="250" r="6" fill="#7fa2c5"/>
  <text x="255" y="325" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102844">Android App</text>
  <text x="255" y="357" text-anchor="middle" class="cardText">Monitor and control</text>
  <g>
    <rect x="140" y="395" width="110" height="78" rx="16" fill="#eaf2ff"/>
    <rect x="260" y="395" width="110" height="78" rx="16" fill="#e8fbf1"/>
    <text x="195" y="425" text-anchor="middle" class="small">TEMP</text>
    <text x="195" y="455" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2f73d9">24.8°C</text>
    <text x="315" y="425" text-anchor="middle" class="small">HUMIDITY</text>
    <text x="315" y="455" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#23a66f">68%</text>
    <rect x="140" y="485" width="230" height="88" rx="16" fill="#e9fff3"/>
    <path d="M235 548 C210 520 220 500 251 501 C282 503 291 525 265 548 C256 556 245 558 235 548Z" fill="#23a66f"/>
    <path d="M251 509 C252 527 249 541 242 553" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="255" y="595" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#168254">GROWTH PROGRESS</text>
    <rect x="140" y="620" width="66" height="46" rx="12" fill="#2f73d9"/>
    <rect x="222" y="620" width="66" height="46" rx="12" fill="#23a66f"/>
    <rect x="304" y="620" width="66" height="46" rx="12" fill="#25a8d8"/>
    <text x="173" y="649" text-anchor="middle" class="pill">LED</text>
    <text x="255" y="649" text-anchor="middle" class="pill">FAN</text>
    <text x="337" y="649" text-anchor="middle" class="pill">PUMP</text>
  </g>

  <!-- Arduino card -->
  <g filter="url(#shadow)">
    <rect x="535" y="225" width="390" height="235" rx="28" fill="#fff"/>
  </g>
  <rect x="565" y="255" width="68" height="68" rx="18" fill="#eaf2ff"/>
  <rect x="584" y="268" width="30" height="42" rx="5" fill="#2f73d9"/>
  <circle cx="589" cy="276" r="3" fill="#fff"/><circle cx="609" cy="276" r="3" fill="#fff"/>
  <circle cx="589" cy="301" r="3" fill="#fff"/><circle cx="609" cy="301" r="3" fill="#fff"/>
  <text x="655" y="281" class="cardTitle">Arduino Nano</text>
  <text x="655" y="315" class="cardText">Real-time sensing and control</text>
  <line x1="565" y1="345" x2="895" y2="345" stroke="#e0e7ef" stroke-width="2"/>
  <text x="565" y="384" class="small">INPUT</text>
  <text x="650" y="384" class="cardText">Temperature · humidity · light · water</text>
  <text x="565" y="423" class="small">OUTPUT</text>
  <text x="650" y="423" class="cardText">Grow light · fan · water pump</text>

  <!-- ESP32 card -->
  <g filter="url(#shadow)">
    <rect x="535" y="510" width="390" height="235" rx="28" fill="#fff"/>
  </g>
  <rect x="565" y="540" width="68" height="68" rx="18" fill="#e8fbf1"/>
  <rect x="579" y="552" width="40" height="35" rx="5" fill="#16324f"/>
  <circle cx="599" cy="569" r="10" fill="#2f73d9" stroke="#b9d5ff" stroke-width="4"/>
  <text x="655" y="566" class="cardTitle">ESP32-CAM</text>
  <text x="655" y="600" class="cardText">Live view and image capture</text>
  <line x1="565" y1="630" x2="895" y2="630" stroke="#e0e7ef" stroke-width="2"/>
  <text x="565" y="670" class="small">STREAM</text>
  <text x="650" y="670" class="cardText">Wi-Fi · HTTP</text>
  <text x="565" y="708" class="small">ENDPOINTS</text>
  <text x="680" y="708" class="cardText">/capture · /stream</text>

  <!-- Dome card -->
  <g filter="url(#shadow)">
    <rect x="1045" y="225" width="475" height="235" rx="28" fill="#fff"/>
  </g>
  <path d="M1105 378 C1107 306 1163 257 1235 257 C1307 257 1363 306 1365 378Z" fill="#eef4f7" stroke="#9fb2c4" stroke-width="3"/>
  <path d="M1146 378 V337 H1324 V378" fill="#dff6e9"/>
  <path d="M1190 369 C1168 344 1181 318 1208 321 C1223 297 1258 303 1261 326 C1292 322 1305 350 1284 369Z" fill="#23a66f"/>
  <text x="1400" y="284" class="cardTitle">Smart Grow Dome</text>
  <text x="1400" y="318" class="cardText">Controlled plant environment</text>
  <rect x="1394" y="346" width="88" height="34" rx="17" fill="#eaf2ff"/>
  <text x="1438" y="369" text-anchor="middle" class="small">SENSORS</text>
  <rect x="1394" y="390" width="100" height="34" rx="17" fill="#e8fbf1"/>
  <text x="1444" y="413" text-anchor="middle" class="small">ACTUATORS</text>

  <!-- Growth detection card -->
  <g filter="url(#shadow)">
    <rect x="1045" y="510" width="475" height="235" rx="28" fill="url(#growth)" stroke="#b8e8cc" stroke-width="2"/>
  </g>
  <rect x="1080" y="545" width="92" height="92" rx="22" fill="#23a66f"/>
  <path d="M1125 616 C1092 582 1108 556 1148 560 C1157 587 1148 606 1125 616Z" fill="#fff"/>
  <path d="M1145 568 C1137 583 1129 598 1113 611" fill="none" stroke="#23a66f" stroke-width="5"/>
  <text x="1200" y="568" class="cardTitle">Growth Detection Model</text>
  <text x="1200" y="602" class="cardText">Analyzes lettuce images over time</text>
  <line x1="1080" y1="655" x2="1485" y2="655" stroke="#b8e8cc" stroke-width="2"/>
  <text x="1080" y="696" class="small">OUTPUT</text>
  <text x="1165" y="696" class="cardText">Growth stage · progress · visual record</text>

  <!-- Connections -->
  <path d="M430 330 C465 330 492 330 535 330" fill="none" stroke="#2f73d9" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M535 370 C493 370 468 370 430 370" fill="none" stroke="#2f73d9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="430" y="290" width="105" height="33" rx="16" fill="#eaf2ff"/>
  <text x="482" y="312" text-anchor="middle" class="link">Bluetooth</text>
  <text x="482" y="398" text-anchor="middle" class="small">HC-06</text>

  <path d="M430 600 C470 600 493 600 535 600" fill="none" stroke="#2f73d9" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M535 640 C493 640 470 640 430 640" fill="none" stroke="#2f73d9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="438" y="560" width="90" height="33" rx="16" fill="#eaf2ff"/>
  <text x="483" y="582" text-anchor="middle" class="link">Wi-Fi</text>
  <text x="482" y="668" text-anchor="middle" class="small">HTTP</text>

  <path d="M925 340 C980 340 1003 340 1045 340" fill="none" stroke="#23a66f" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M1045 390 C1000 390 979 390 925 390" fill="none" stroke="#23a66f" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="983" y="314" text-anchor="middle" class="linkGreen">Control</text>
  <text x="984" y="420" text-anchor="middle" class="small">Sensor data</text>

  <path d="M925 620 C980 620 1000 620 1045 620" fill="none" stroke="#16324f" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <text x="984" y="596" text-anchor="middle" class="small">Camera frames</text>

  <path d="M1045 715 C980 790 825 818 655 800 C525 786 418 735 382 686" fill="none" stroke="#23a66f" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowGreen)"/>
  <rect x="672" y="775" width="235" height="38" rx="19" fill="#e8fbf1"/>
  <text x="790" y="800" text-anchor="middle" class="linkGreen">Growth result to app</text>

  <text x="80" y="858" font-family="Arial" font-size="16" fill="#78899c">Jinie EduTech · AI Smart Farm</text>
</svg>
